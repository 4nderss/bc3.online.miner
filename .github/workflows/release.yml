# Cuts a release from a version tag: tests, builds Windows and Linux,
# checksums and attests both, and opens a DRAFT release for review.
#
# Draft on purpose. Publishing is irreversible in practice - people and mirrors
# pick releases up within minutes - so the last step stays a human click. Change
# `--draft` below only if you are prepared for that.
#
# Actions are pinned by commit SHA, not by tag. Tags move; a compromised or
# retagged action would otherwise run inside the job that produces the binaries
# people download. The version each SHA corresponds to is in the comment.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.2.0)"
        required: true
  # Publishing the draft is what moves :latest - see the `promote` job.
  release:
    types: [published]

# Two runs for the same tag must not race to create the release. Queue rather
# than cancel: a half-finished release job leaves artifacts uploaded and no
# release to attach them to.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the two jobs that need more grant it themselves.
permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            gui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # A release must not ship code that never ran its own tests.
      - name: Test (core)
        run: cargo test --release

      - name: Build miner (CLI)
        run: cargo build --release
      # Must precede anything that touches the GUI crate, tests included:
      # tauri-build resolves externalBin in a build script, so a missing
      # sidecar fails the crate before a single test runs.
      - name: Stage sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path gui/src-tauri/binaries | Out-Null
          Copy-Item target/release/bc3-miner.exe gui/src-tauri/binaries/bc3-miner-x86_64-pc-windows-msvc.exe
      - name: Test (GUI)
        run: cargo test --release --manifest-path gui/src-tauri/Cargo.toml
      - name: Build GUI
        run: cargo build --release --manifest-path gui/src-tauri/Cargo.toml
      # The version reaches the script through the environment, never through
      # ${{ }} interpolation. Interpolation splices the value into the script
      # BEFORE the shell sees it, so a version string containing shell syntax
      # runs as code - inside the job that signs and publishes the binaries.
      - name: Package
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = $env:INPUT_VERSION
          if (-not $v) { $v = $env:REF_NAME -replace '^v', '' }
          $out = "bc3-miner-$v-windows-x86_64"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item target/release/bc3-miner.exe $out/
          Copy-Item gui/src-tauri/target/release/bc3-miner-gui.exe $out/
          Copy-Item README.md, LICENSE $out/
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: "*.zip"

  linux:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --release

      # CLI only. The GUI needs webkit2gtk and has never shipped for Linux;
      # earlier releases were CLI-only here too.
      - name: Build miner (CLI)
        run: cargo build --release
      # Via the environment, not ${{ }} - see the Windows job.
      - name: Package
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          v="$INPUT_VERSION"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          out="bc3-miner-$v-linux-x86_64"
          mkdir "$out"
          cp target/release/bc3-miner README.md LICENSE "$out/"
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: "*.tar.gz"

  # The container image. Built from the same tag as the binaries, so pulling
  # ghcr.io/OWNER/bc3-miner:1.2.0 gets you exactly what the zip contains.
  image:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/bc3-miner
          # :1.2.0 and :1.2 only. NOT :latest - see the `promote` job: the
          # release this image belongs to is still a draft at this point, and
          # :latest is what every unpinned `docker run` and the compose file
          # resolve to. Moving it here would put a build nobody has reviewed
          # in front of everyone, minutes after a tag was pushed, and the draft
          # step exists precisely so that cannot happen.
          # `value` is required for workflow_dispatch: without it the
          # metadata-action derives the version from the git tag, and on a
          # dispatch run the ref is `refs/heads/main`. That produced ZERO tags,
          # and build-push-action with push:true then fails the whole image job
          # - which takes `release` with it, since release needs it. An empty
          # `value` falls back to the ref, so the tag path is unchanged.
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version }}

      # The runner's default buildx driver is "docker", which cannot export a
      # cache - that is what killed the first attempt at this job. This sets up
      # a docker-container builder, which can.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same provenance the binaries get: a signed statement tying this image
      # to the commit and workflow that built it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bc3-miner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    if: github.event_name != 'release'
    needs: [windows, linux, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      # One SHA256SUMS covering every artifact, in the format sha256sum -c reads.
      # The README tells people to verify their download; this is what they
      # verify against.
      - name: Checksums
        run: |
          sha256sum bc3-miner-*.zip bc3-miner-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # A checksum only proves the download matches what was uploaded. This
      # signs a statement binding each artifact to the commit and workflow that
      # produced it, which is the part a checksum can never establish. Verified
      # with: gh attestation verify <file> --repo 4nderss/bc3.online.miner
      # SHA256SUMS is attested TOO, and that is not redundant. The README tells
      # people to check the checksums; if only the archives are attested, the
      # file listing their hashes is the one unsigned link in that chain, and
      # swapping it swaps what "verified" means.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "bc3-miner-*.zip,bc3-miner-*.tar.gz,SHA256SUMS"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          v="$INPUT_VERSION"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --draft \
            --title "v$v" --generate-notes \
            bc3-miner-*.zip bc3-miner-*.tar.gz SHA256SUMS

  # Move :latest, once a human has published the draft.
  #
  # This is the only step that changes what an unpinned `docker run` or the
  # compose file gets. Everything before it is reviewable in a draft; this
  # follows the same human decision, so the tag can never run ahead of it.
  #
  # It re-tags the image that was already built and attested - no rebuild, so
  # :latest and :1.2.0 are the same digest, and the attestation still applies.
  promote:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Point :latest at this release's image
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/bc3-miner
        run: |
          v="${TAG_NAME#v}"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$v"
          docker buildx imagetools inspect "$IMAGE:latest" | head -5
