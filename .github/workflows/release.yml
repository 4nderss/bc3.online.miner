# Cuts a release from a version tag: tests, builds Windows and Linux,
# checksums and attests both, and opens a DRAFT release for review.
#
# Draft on purpose. Publishing is irreversible in practice - people and mirrors
# pick releases up within minutes - so the last step stays a human click. Change
# `--draft` below only if you are prepared for that.
#
# Actions are pinned by commit SHA, not by tag. Tags move; a compromised or
# retagged action would otherwise run inside the job that produces the binaries
# people download. The version each SHA corresponds to is in the comment.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.2.0)"
        required: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            gui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # A release must not ship code that never ran its own tests.
      - name: Test (core)
        run: cargo test --release

      - name: Build miner (CLI)
        run: cargo build --release
      # Must precede anything that touches the GUI crate, tests included:
      # tauri-build resolves externalBin in a build script, so a missing
      # sidecar fails the crate before a single test runs.
      - name: Stage sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path gui/src-tauri/binaries | Out-Null
          Copy-Item target/release/bc3-miner.exe gui/src-tauri/binaries/bc3-miner-x86_64-pc-windows-msvc.exe
      - name: Test (GUI)
        run: cargo test --release --manifest-path gui/src-tauri/Cargo.toml
      - name: Build GUI
        run: cargo build --release --manifest-path gui/src-tauri/Cargo.toml
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^v', '' }
          $out = "bc3-miner-$v-windows-x86_64"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item target/release/bc3-miner.exe $out/
          Copy-Item gui/src-tauri/target/release/bc3-miner-gui.exe $out/
          Copy-Item README.md, LICENSE $out/
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: "*.zip"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --release

      # CLI only. The GUI needs webkit2gtk and has never shipped for Linux;
      # earlier releases were CLI-only here too.
      - name: Build miner (CLI)
        run: cargo build --release
      - name: Package
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          out="bc3-miner-$v-linux-x86_64"
          mkdir "$out"
          cp target/release/bc3-miner README.md LICENSE "$out/"
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: "*.tar.gz"

  # The container image. Built from the same tag as the binaries, so pulling
  # ghcr.io/OWNER/bc3-miner:1.2.0 gets you exactly what the zip contains.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/bc3-miner
          # :1.2.0, :1.2, :latest - so people can pin as loosely as they like.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The runner's default buildx driver is "docker", which cannot export a
      # cache - that is what killed the first attempt at this job. This sets up
      # a docker-container builder, which can.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same provenance the binaries get: a signed statement tying this image
      # to the commit and workflow that built it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bc3-miner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      # One SHA256SUMS covering every artifact, in the format sha256sum -c reads.
      # The README tells people to verify their download; this is what they
      # verify against.
      - name: Checksums
        run: |
          sha256sum bc3-miner-*.zip bc3-miner-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # A checksum only proves the download matches what was uploaded. This
      # signs a statement binding each artifact to the commit and workflow that
      # produced it, which is the part a checksum can never establish. Verified
      # with: gh attestation verify <file> --repo 4nderss/bc3.online.miner
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "bc3-miner-*.zip,bc3-miner-*.tar.gz"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --draft \
            --title "v$v" --generate-notes \
            bc3-miner-*.zip bc3-miner-*.tar.gz SHA256SUMS
