# Builds and tests on every push, and uploads the Windows binaries.
#
# No CUDA toolkit is installed for the build on purpose: build.rs falls back
# to the PTX checked into src/kernels/, and cudarc loads the driver
# dynamically, so one binary runs with CUDA, with OpenCL, or on CPU alone.
# Installing the toolkit would only slow the build down and risk shipping a
# kernel nobody reviewed. The toolkit runs in containers of its own only: the
# ptx job checks the committed PTX against its source, and the sass job makes
# machine code from that PTX, which the build embeds beside it.
#
# Actions are pinned by commit SHA, not by tag. Tags move; a compromised or
# retagged action would otherwise run inside the job that produces the binaries
# people download. The version each SHA corresponds to is in the comment.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Without this a pull request got no check at all - a PR that changed only
  # the committed PTX, the one file nobody can review by reading, ran nothing.
  pull_request:
    branches: [main]

# Least privilege by default. Without a workflow-level block every job gets
# whatever the repository default is, which for older repositories is
# read/write on contents - far more than a build needs, inside the job that
# produces the binaries people download.
permissions:
  contents: read

# A newer push makes an in-flight build irrelevant. Cancel it rather than pay
# for two Windows runners racing to tell us about different commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The committed PTX is the one kind of file in the repository nobody can
  # review by reading it - generated assembly, tens of thousands of lines per
  # table window. Without this job a pull request could change it alone,
  # leaving the kernel source saying one thing and the binary doing another,
  # and every human reviewer would see a diff they have no way to check.
  #
  # The toolkit version is pinned to 12.0 for the same reason build.rs caps the
  # ISA version: it decides which drivers can load the result. See AGENTS.md.
  ptx:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.0.1-devel-ubuntu22.04
    steps:
      # The image has no git, so actions/checkout silently falls back to the
      # REST tarball. That works for a public repo today, but it breaks the
      # moment anyone adds fetch-depth or a submodule - and it would break
      # confusingly.
      - name: git, which the CUDA image does not ship
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate the PTX from the kernel source
        # One PTX per secp256k1 table window and one of the table builder,
        # each with the defines tools/ptx.sh lists - see build.rs.
        run: sh tools/ptx.sh /tmp/ptx
      - name: It must match what is committed
        run: |
          # nvcc stamps its own version into a banner comment; that line is
          # about the compiler, not the kernel, so it is not part of the check.
          #
          # Nor is the hash in the names nvcc gives functions with internal
          # linkage (_INTERNAL_<hash>_...): it is derived from the absolute
          # path of the source file. The committed PTX was built in /work, as
          # AGENTS.md says (fdfb051c); built from a checkout in
          # /__w/bc3.online.miner/bc3.online.miner it gets 2495b0d9, and no
          # other line differs.
          #
          # POSIX sh, not bash: this job runs in a container, where the step
          # shell is /bin/sh - dash on Ubuntu. Process substitution here was a
          # syntax error, so the check exited 2 without ever comparing anything.
          # A check that cannot fail for the right reason is worse than none.
          for f in /tmp/ptx/*.ptx; do
            k=$(basename "$f" .ptx)
            if [ ! -f "src/kernels/$k.ptx" ]; then
              echo "src/kernels/$k.ptx is not committed - run tools/ptx.sh (AGENTS.md)."
              exit 1
            fi
            sed -e '/^\/\//d' -e 's/_INTERNAL_[0-9a-f]*_/_INTERNAL_/g' \
              src/kernels/$k.ptx > /tmp/committed.ptx
            sed -e '/^\/\//d' -e 's/_INTERNAL_[0-9a-f]*_/_INTERNAL_/g' \
              "$f" > /tmp/regenerated.ptx
            if ! diff -q /tmp/committed.ptx /tmp/regenerated.ptx; then
              echo
              echo "The committed src/kernels/$k.ptx does not match its kernel source."
              echo "Regenerate it with tools/ptx.sh (AGENTS.md) and commit the result."
              exit 1
            fi
          done
          # Nor may a PTX be committed that the source no longer makes: it
          # would get machine code made and shipped for nothing.
          for f in src/kernels/bc3hash_*.ptx; do
            if [ ! -f "/tmp/ptx/$(basename "$f")" ]; then
              echo "$f is not made by tools/ptx.sh - remove it, or add it there."
              exit 1
            fi
          done

  # Machine code of the kernel for the common GPU architectures, from the
  # committed PTX (tools/sass.sh): a card with its own loads it in a second,
  # where the driver's JIT of the PTX takes 20-60 s. Built here for every
  # build, never committed. CUDA 12.9: the newest toolkit whose machine code
  # every CUDA 12 driver loads, and one that knows Blackwell. See AGENTS.md.
  sass:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.9.1-devel-ubuntu22.04
    steps:
      - name: git, which the CUDA image does not ship
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Machine code for every window and architecture
        run: sh tools/sass.sh src/kernels/sass
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sass
          path: src/kernels/sass/
          retention-days: 14

  windows:
    needs: sass
    runs-on: windows-latest
    # build.rs fails the build if the machine code is missing or was made
    # from another PTX, rather than ship a binary that JITs on every card.
    env:
      BC3_REQUIRE_SASS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sass
          path: src/kernels/sass

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            gui/src-tauri/target
            wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The GPU tests are #[ignore]d and stay that way: no runner has a GPU.
      # What runs here is the CPU half - the consensus vectors, the node's
      # BC3Hash vectors, the worker pipelines, and the pool protocol.
      - name: Test (core)
        run: cargo test --release
      # The internal tools (--benchmark, --solve; see AGENTS.md) are behind a
      # feature no release enables. Built and tested here so they cannot rot.
      # Before "Build miner (CLI)" on purpose: that step builds
      # target/release/bc3-miner.exe with the default features, whatever an
      # earlier step left there, and that is the binary the package and the
      # GUI get.
      - name: Test (internal tools)
        run: cargo test --release --features internal-tools
      - name: Test (wasm crate, host target)
        run: cargo test --release --manifest-path wasm/Cargo.toml

      - name: Build miner (CLI)
        run: cargo build --release

      # The GUI embeds the CLI as a Tauri sidecar, so it has to be in place
      # before anything touches the GUI crate - including its tests. tauri-build
      # resolves externalBin in a build script, so a missing sidecar fails the
      # crate before a single test runs.
      - name: Stage sidecar
        shell: pwsh
        run: |
          # binaries/ is gitignored, so on a fresh checkout it does not exist.
          New-Item -ItemType Directory -Force -Path gui/src-tauri/binaries | Out-Null
          Copy-Item target/release/bc3-miner.exe gui/src-tauri/binaries/bc3-miner-x86_64-pc-windows-msvc.exe

      - name: Test (GUI)
        run: cargo test --release --manifest-path gui/src-tauri/Cargo.toml

      - name: Build GUI
        run: cargo build --release --manifest-path gui/src-tauri/Cargo.toml

      # Loose files, not a zip: Actions wraps every artifact in a zip on
      # download, so uploading a zip would hand the user a zip inside a zip.
      - name: Assemble package
        shell: pwsh
        run: |
          $out = "bc3-miner-windows-x64"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item target/release/bc3-miner.exe $out/
          Copy-Item gui/src-tauri/target/release/bc3-miner-gui.exe $out/
          Copy-Item README.md, LICENSE $out/
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bc3-miner-windows-x64
          path: bc3-miner-windows-x64/
          retention-days: 14
