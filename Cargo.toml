[package]
name = "bc3miner"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/4nderss/bc3.online.miner"
description = "GPU/CPU miner for BC3 (BitcoinIII, SHA3-256t) — the bc3.online client"

[[bin]]
name = "bc3-miner"
path = "src/main.rs"

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
