[package]
name = "bc3miner"
version = "1.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/4nderss/bc3.online.miner"
description = "GPU/CPU miner for BC3 (BitcoinIII, SHA3-256t) — the bc3.online client"

[[bin]]
name = "bc3-miner"
path = "src/main.rs"

[features]
# CUDA är på som standard: libcuda/libnvrtc laddas dynamiskt i runtime, så
# binären fungerar även på maskiner utan NVIDIA-drivrutin (CPU-fallback).
# Bada GPU-vagarna ingar i standardbygget: bada laddas dynamiskt i runtime,
# sa EN binar kor CUDA pa NVIDIA, OpenCL pa AMD/Intel och CPU om inget finns.
default = ["cuda", "opencl"]
cuda = ["dep:cudarc", "dep:nvml-wrapper"]
# OpenCL laddas dynamiskt via src/backend/cl_sys.rs — INTE lankat mot
# OpenCL.lib/libOpenCL.so. Statisk lankning hade gjort att binaren vagrade
# starta pa maskiner utan OpenCL-runtime.
opencl = ["dep:libloading"]

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# nvrtc-featuren behövs bara för Ptx-typen — kerneln kompileras vid bygget
# (build.rs), aldrig i runtime, så libnvrtc laddas aldrig.
nvml-wrapper = { version = "0.10", optional = true }
cudarc = { version = "0.19", default-features = false, features = [
    "std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-12040",
], optional = true }
libloading = { version = "0.8", optional = true }

# Obs: inte panic = "abort" — cudarc:s dynamiska laddare panikar om libcuda
# saknas, och CUDA-detekteringen fångar det med catch_unwind (CPU-fallback).
[profile.release]
lto = "thin"
codegen-units = 1
