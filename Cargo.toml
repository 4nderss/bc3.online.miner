[package]
name = "bc3miner"
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/4nderss/bc3.online.miner"
description = "GPU/CPU miner for BC3 (BitcoinIII) - the bc3.online client"

[[bin]]
name = "bc3-miner"
path = "src/main.rs"

[features]
# CUDA is on by default: libcuda/libnvrtc are loaded dynamically at runtime,
# so the binary works even on machines without an NVIDIA driver (CPU
# fallback). Both GPU paths are part of the default build: both are loaded
# dynamically at runtime, so ONE binary runs CUDA on NVIDIA, OpenCL on
# AMD/Intel and CPU if there is nothing.
default = ["cuda", "opencl", "bc3hash"]
# Both GPU backends bring bc3hash with them: BC3Hash is the only kernel either
# has, and its GPU tables and the CPU re-check of every hit come from it.
cuda = ["dep:cudarc", "dep:nvml-wrapper", "bc3hash"]
# OpenCL is loaded dynamically via src/backend/cl_sys.rs - NOT linked against
# OpenCL.lib/libOpenCL.so. Static linking would have made the binary refuse
# to start on machines without an OpenCL runtime.
opencl = ["dep:libloading", "bc3hash"]
# BC3Hash, the PoW since the second fork: the node's own C++ (bc3hash/), mined
# on the CPU and the reference every GPU hit is checked against. Without it
# the miner mines nothing. Needs a C++20 compiler with unsigned __int128 - GCC
# or Clang, and clang-cl rather than cl.exe on Windows (bc3hash/build.rs
# picks it).
bc3hash = ["dep:bc3hash"]
# Development tools, never in a release: --benchmark, --solve and the knobs
# only they need (--bc3-window, --bc3hash-mode, --gpu-queue, ...). Without the
# feature those options do not exist at all, not even hidden. See AGENTS.md.
internal-tools = []

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The env feature lets every flag be set from the environment as well, which
# is what makes the container image usable without an entrypoint script.
clap = { version = "4", features = ["derive", "env"] }
# The nvrtc feature is only needed for the Ptx type - the kernel is compiled
# at build time (build.rs), never at runtime, so libnvrtc is never loaded.
nvml-wrapper = { version = "0.10", optional = true }
cudarc = { version = "0.19", default-features = false, features = [
    "std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-12040",
], optional = true }
libloading = { version = "0.8", optional = true }

# Never in a wasm build: the browser miner has no C++ toolchain behind it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bc3hash = { path = "bc3hash", optional = true }

# Note: not panic = "abort" - cudarc's dynamic loader panics if libcuda is
# missing, and the CUDA detection catches that with catch_unwind (CPU
# fallback).
[profile.release]
lto = "thin"
codegen-units = 1
