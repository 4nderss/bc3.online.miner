[package]
name = "bc3-miner-gui"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "bc3.online miner — desktop GUI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
