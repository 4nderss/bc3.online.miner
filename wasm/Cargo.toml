[package]
name = "bc3-miner-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SHA3-256t-sokkarna for bc3.online:s webbaserade miner (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Samma hashimplementation som CLI-minern anvander. Kerneln maste vara
# bit-exakt lika — en share som webbminern hittar ska poolen acceptera.
sha3 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
# Hastighet framfor storlek: det har ar en hashloop, inte en widget.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
