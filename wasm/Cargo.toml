[package]
name = "bc3-miner-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SHA3-256t-sokkarna for bc3.online:s webbaserade miner (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same hash implementation the CLI miner uses. The kernel must be
# bit-exactly equal - a share the web miner finds must be accepted by the pool.
sha3 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# src/consensus.rs, shared with the CLI, asks for the CLI's `bc3hash` feature.
# This crate never has it - BC3Hash is the node's C++, which has no place in a
# browser - so the check-cfg lint is told to expect the name.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("bc3hash"))'] }

[profile.release]
# Speed over size: this is a hash loop, not a widget.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
